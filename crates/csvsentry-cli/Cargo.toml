[package]
name = "csvsentry-cli"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
description = "Command-line CSV validator"

[[bin]]
name = "csvsentry"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
csvsentry-core = { path = "../csvsentry-core" }
axoupdater = { version = "0.10.3", features = ["blocking"] }
serde_json = { version = "1.0.154" }


[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "8DF78A7B-4520-46F1-979C-98613A20BC5A"
path-guid = "6AADE624-7FEC-41EE-9FD3-CA500822F6E9"
license = false
eula = false
