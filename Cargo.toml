[workspace]
members = ["crates/*"]
resolver = "3"


[workspace.package]
edition = "2024"
authors = ["Rodhor"]
license = "MIT"
repository = "https://github.com/Rodhor/csvsentry"
readme = "README.md"
publish = false

[workspace.metadata.release]
publish = false
tag-name = "{{crate_name}}-v{{version}}"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
